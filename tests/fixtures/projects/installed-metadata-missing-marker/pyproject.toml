# An in-tree *.egg-info directory exists but has no PKG-INFO file --
# gets its own distinct WARNING (not silent), candidate skipped.

[project]
name = "sampleproject-installed-nomarker"
version = "1.0.0"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
