# A decoy vendor/somepkg.egg-info/PKG-INFO sits several levels deep --
# must NOT be matched: only the fixed shallow glob patterns
# (*.egg-info, *.dist-info, src/*/*.egg-info, src/*/*.dist-info) are
# searched, never a recursive rglob walk into a vendored tree.

[project]
name = "sampleproject-installed-decoy"
version = "1.0.0"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
