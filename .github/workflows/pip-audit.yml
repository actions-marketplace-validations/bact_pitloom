name: pip-audit

on:
  push:
    paths: &trigger-paths
      - "pyproject.toml"
      - ".github/workflows/pip-audit.yml"
      - ".github/actions/**"
  pull_request:
    paths: *trigger-paths
  schedule:
    # Weekly, Monday 03:41 UTC -- catches newly disclosed CVEs against
    # unchanged pins, not just dependency edits.
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: ./.github/actions/setup-python
        with:
          python-version: "3.14"

      - name: Install project and dependencies
        uses: ./.github/actions/install-pitloom
        with:
          groups: --group dev
          package-spec: ".[ai,content-type]"

      - name: Run pip-audit
        # Failed pip-audit = blocking
        run: pip-audit --progress-spinner=off
