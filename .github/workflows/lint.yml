name: Lint and format

on:
  push:
    branches: [main, develop]
    paths-ignore: &ignore-paths
      - "docs/**"
      - "**/*.md"
      - "LICENSE*"
      - "CITATION.cff"
      - "codemeta.json"
      - ".gitignore"
  pull_request:
    branches: [main, develop]
    paths-ignore: *ignore-paths

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: Ruff (Lint & Format)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install hatchling pybind11 setuptools
          pip install --group lint --group test
          # pyproject.toml lists "pitloom" as its own build dependency
          # (self-embeds its SBOM); isolated builds can fetch a stale,
          # crashing PyPI copy. --no-build-isolation skips that fetch;
          # HATCH_BUILD_NO_HOOKS skips the hook (nothing provides it
          # yet); setuptools/pybind11 cover dependencies built from
          # source (fasttext's setup.py imports pybind11 directly).
          HATCH_BUILD_NO_HOOKS=1 pip install ".[ai,content-type]" --no-build-isolation

      - name: Ruff check
        run: |
          ruff check examples/ src/ tests/

      - name: Pylint
        run: |
          pylint examples/ src/ tests/

      - name: Flake8
        run: |
          flake8 examples/ src/ tests/

      - name: Ruff formatter check
        run: |
          ruff format --check examples/ src/ tests/
