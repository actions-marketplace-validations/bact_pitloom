name: Type checking

on:
  push:
    branches: [main, develop]
    paths-ignore: &ignore-paths
      - "docs/**"
      - "**/*.md"
      - "LICENSE*"
      - "CITATION.cff"
      - "codemeta.json"
      - ".gitignore"
  pull_request:
    branches: [main, develop]
    paths-ignore: *ignore-paths

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mypy:
    name: Type checking (mypy, pyright, pyrefly)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: ./.github/actions/setup-pitloom-ci
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install ".[ai,content-type]"
          pip install --group test --group typecheck

      - name: mypy
        run: |
          mypy examples/ src/ tests/

      - name: pyright
        run: |
          pyright examples/ src/ tests/

      - name: pyrefly
        run: |
          pyrefly check examples/ src/ tests/
